<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPHO — цифровой магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0ff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 800px; padding: 20px; }
        .icon {
            font-size: 70px;
            color: #7c3aed;
            margin-bottom: 20px;
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .main-title {
            font-size: 90px;
            font-weight: 900;
            color: #5b21b6;
            letter-spacing: 8px;
            line-height: 1.1;
        }
        .sub-title {
            font-size: 28px;
            font-weight: 400;
            color: #7c3aed;
            margin-top: 10px;
            letter-spacing: 4px;
        }
        .description {
            font-size: 16px;
            color: #6d28d9;
            margin-top: 30px;
            opacity: 0.8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-primary {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }
        .btn-primary:hover {
            background: #5b21b6;
            transform: scale(1.05);
        }
        .btn-outline {
            background: transparent;
            color: #7c3aed;
            border: 2px solid #7c3aed;
        }
        .btn-outline:hover {
            background: #7c3aed;
            color: #fff;
        }
        @media (max-width: 600px) {
            .main-title { font-size: 55px; }
            .sub-title { font-size: 20px; }
            .icon { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"><i class="fas fa-cog"></i></div>
        <h1 class="main-title">VPHO</h1>
        <p class="sub-title">⚡ цифровой магазин</p>
        <p class="description">
            Готовые решения для вашего ПК.<br>
            Надёжно. Просто. С заботой о вас.
        </p>
        <div class="btn-group">
            <a href="register.html" class="btn btn-primary">Зарегистрироваться</a>
            <a href="login.html" class="btn btn-outline">Войти</a>
        </div>
    </div>
</body>
</html>
